name: Renomear para index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renomear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renomear arquivo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv landing-page-katia-moreno-buffet.html index.html
          git commit -m "Renomear landing page para index.html"
          git push
